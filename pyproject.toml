[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chakrashield"
version = "0.1.0"
description = "Cross-platform defensive network visibility and PCAP analysis GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
capture = ["scapy>=2.5"]
test = ["pytest>=8"]

[project.scripts]
chakrashield = "sentinel.cli:main"
chakrashield-gui = "sentinel.gui:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
